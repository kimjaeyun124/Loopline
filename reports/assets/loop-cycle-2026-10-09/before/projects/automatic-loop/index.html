<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Focus Board — 나의 학습 보드</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div class="brand-mark" aria-hidden="true">F</div>
      <div>
        <p class="eyebrow">STUDY, ONE STEP AT A TIME</p>
        <h1>Focus Board</h1>
        <p class="page-description">오늘의 학습을 작게 나누고, 꾸준히 이어가 보세요.</p>
      </div>
    </header>

    <section class="stats-grid" aria-label="전체 학습 통계">
      <article class="stat-card stat-card-primary">
        <span class="stat-label">전체 작업</span>
        <strong id="totalCount" class="stat-value">0</strong>
        <span class="stat-caption">등록한 학습 항목</span>
      </article>
      <article class="stat-card">
        <span class="stat-label">진행 중</span>
        <strong id="activeCount" class="stat-value">0</strong>
        <span class="stat-caption">이어갈 작업</span>
      </article>
      <article class="stat-card">
        <span class="stat-label">완료</span>
        <strong id="completedCount" class="stat-value">0</strong>
        <span class="stat-caption">마친 작업</span>
      </article>
      <article class="stat-card">
        <span class="stat-label">학습 시간</span>
        <strong class="stat-value"><span id="totalMinutes">0</span><span class="stat-unit">분</span></strong>
        <span class="stat-caption">전체 계획 시간</span>
      </article>
    </section>

    <section class="panel composer-panel" aria-labelledby="formHeading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">새로운 시작</p>
          <h2 id="formHeading">학습 작업 추가</h2>
        </div>
        <span class="heading-icon" aria-hidden="true">＋</span>
      </div>
      <form id="taskForm" novalidate>
        <div class="form-grid">
          <div class="field field-title">
            <label for="taskTitle">작업 제목</label>
            <input id="taskTitle" name="title" type="text" autocomplete="off" placeholder="예: 미적분 복습">
          </div>
          <div class="field">
            <label for="taskSubject">과목</label>
            <input id="taskSubject" name="subject" type="text" autocomplete="off" placeholder="예: 수학">
          </div>
          <div class="field field-minutes">
            <label for="taskMinutes">학습 시간 <span class="label-hint">분</span></label>
            <input id="taskMinutes" name="minutes" type="number" step="1" inputmode="numeric" placeholder="30">
          </div>
          <button id="addTask" class="button button-primary add-button" type="submit">작업 추가 <span aria-hidden="true">→</span></button>
        </div>
        <p id="formError" class="form-error" aria-live="polite" role="alert" hidden></p>
      </form>
    </section>

    <section class="task-section" aria-labelledby="listHeading">
      <div class="list-heading-row">
        <div>
          <p class="eyebrow">YOUR FOCUS LIST</p>
          <h2 id="listHeading">학습 작업</h2>
        </div>
        <label class="search-field">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <span class="visually-hidden">제목 또는 과목 검색</span>
          <input id="searchInput" type="search" placeholder="작업 검색" autocomplete="off">
        </label>
      </div>
      <div class="list-toolbar">
        <div class="filter-group" role="group" aria-label="작업 필터">
          <button id="filterAll" class="filter-button is-selected" type="button" aria-pressed="true">전체</button>
          <button id="filterActive" class="filter-button" type="button" aria-pressed="false">진행 중</button>
          <button id="filterCompleted" class="filter-button" type="button" aria-pressed="false">완료</button>
        </div>
        <p class="list-hint">작업은 이 기기에 자동 저장됩니다.</p>
      </div>
      <p id="statusMessage" class="status-message" aria-live="polite" role="status"></p>
      <div id="taskList" class="task-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span></div>
        <h3>집중할 일을 정해볼까요?</h3>
        <p>작업을 추가하면 이곳에서 학습 흐름을 관리할 수 있어요.</p>
      </div>
    </section>
    <footer class="page-footer"><span class="footer-dot" aria-hidden="true"></span>한 번에 한 걸음, 나만의 속도로</footer>
  </main>
</body>
</html>

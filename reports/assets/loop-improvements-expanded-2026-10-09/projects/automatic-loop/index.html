<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f7f7">
  <title>Focus Board — 학습 작업 보드</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main class="board">
    <header class="page-header">
      <div class="brand-mark" aria-hidden="true">F</div>
      <div>
        <p class="eyebrow">나의 학습 공간</p>
        <h1>Focus Board</h1>
        <p class="intro">작은 학습을 쌓아 오늘의 집중을 완성해요.</p>
      </div>
    </header>

    <section class="summary" aria-label="전체 학습 요약">
      <article class="summary-card summary-total"><span class="summary-label">전체 작업</span><strong id="totalCount">0</strong><span class="summary-unit">개</span></article>
      <article class="summary-card"><span class="summary-label">진행 중</span><strong id="activeCount">0</strong><span class="summary-unit">개</span></article>
      <article class="summary-card"><span class="summary-label">완료</span><strong id="completedCount">0</strong><span class="summary-unit">개</span></article>
      <article class="summary-card"><span class="summary-label">학습 시간</span><strong id="totalMinutes">0</strong><span class="summary-unit">분</span></article>
    </section>

    <section class="panel composer" aria-labelledby="formHeading">
      <div class="section-heading">
        <div><p class="eyebrow">계획 세우기</p><h2 id="formHeading">새 작업 추가</h2></div>
        <span class="heading-icon" aria-hidden="true">＋</span>
      </div>
      <form id="taskForm" novalidate>
        <div class="form-fields">
          <div class="field field-title"><label for="taskTitle">작업 제목</label><input id="taskTitle" name="title" type="text" maxlength="100" placeholder="예: 과학 개념 복습" autocomplete="off"></div>
          <div class="field"><label for="taskSubject">과목</label><input id="taskSubject" name="subject" type="text" maxlength="30" placeholder="예: 과학" autocomplete="off"></div>
          <div class="field field-minutes"><label for="taskMinutes">학습 시간 <span>(분)</span></label><input id="taskMinutes" name="minutes" type="number" min="1" max="480" step="1" placeholder="30"></div>
          <button id="addTask" class="primary-button" type="submit"><span aria-hidden="true">＋</span> 작업 추가</button>
        </div>
        <p id="formError" class="form-error" role="alert" aria-live="assertive" hidden></p>
      </form>
    </section>

    <section class="panel task-panel" aria-labelledby="listHeading">
      <div class="list-heading section-heading">
        <div><p class="eyebrow">오늘의 계획</p><h2 id="listHeading">학습 작업</h2></div>
        <label class="search-box" for="searchInput"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="제목 또는 과목 검색" autocomplete="off"></label>
      </div>
      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="작업 필터">
          <button id="filterAll" class="filter-button is-selected" type="button" aria-pressed="true">전체</button>
          <button id="filterActive" class="filter-button" type="button" aria-pressed="false">진행 중</button>
          <button id="filterCompleted" class="filter-button" type="button" aria-pressed="false">완료</button>
        </div>
        <span class="list-hint">필터와 검색은 전체 요약에 영향을 주지 않아요.</span>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
      <div id="emptyState" class="empty-state">
        <span class="empty-icon" aria-hidden="true">✦</span>
        <h3>아직 표시할 작업이 없어요</h3>
        <p>새 학습 작업을 추가하거나 검색·필터 조건을 바꿔 보세요.</p>
      </div>
      <ul id="taskList" class="task-list" aria-label="학습 작업 목록"></ul>
    </section>
    <footer class="page-footer">꾸준한 한 걸음이 목표에 가까워지는 방법이에요.</footer>
  </main>
</body>
</html>
